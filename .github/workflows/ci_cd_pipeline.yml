name: CI/CD Pipeline


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_backend:
        description: "Force deploy backend (even if no changes detected)"
        type: boolean
        default: false
      force_frontend:
        description: "Force deploy frontend (even if no changes detected)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1 — Detect Changed Paths
  # ──────────────────────────────────────────────────────────────
  detect-changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      deploy_infra: ${{ steps.changes.outputs.deploy_infra }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }} HEAD 2>/dev/null || echo "")
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          echo "📝 Changed files in this event:"
          if [ -z "$CHANGED" ]; then
            echo "  (none detected or manual force trigger)"
          else
            echo "$CHANGED" | sed 's/^/  /'
          fi

          BACKEND=false
          FRONTEND=false
          DEPLOY_INFRA=false

          echo "$CHANGED" | grep -qE "^backend/" && BACKEND=true
          echo "$CHANGED" | grep -qE "^frontend/" && FRONTEND=true
          echo "$CHANGED" | grep -qE "^backend/deploy/" && DEPLOY_INFRA=true

          # If deploy template/samconfig changed, redeploy backend
          [ "$DEPLOY_INFRA" = "true" ] && BACKEND=true

          # Manual force overrides
          [ "${{ inputs.force_backend }}" = "true" ] && BACKEND=true
          [ "${{ inputs.force_frontend }}" = "true" ] && FRONTEND=true

          # If it's a push on main and diff was empty, default to deploying everything
          if [ "${{ github.event_name }}" = "push" ] && [ "$BACKEND" = "false" ] && [ "$FRONTEND" = "false" ]; then
            echo "ℹ️  Triggered on main branch push without path match — running full build & deploy."
            BACKEND=true
            FRONTEND=true
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "deploy_infra=$DEPLOY_INFRA" >> "$GITHUB_OUTPUT"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🔧 Backend changed      : $BACKEND"
          echo "  🎨 Frontend changed     : $FRONTEND"
          echo "  📐 Deploy infra changed : $DEPLOY_INFRA"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ──────────────────────────────────────────────────────────────
  # JOB 2 — Backend Tests
  # ──────────────────────────────────────────────────────────────
  test-backend:
    name: "🧪 Test Backend"
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run health check test
        run: |
          PYTHONPATH=src uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          UVICORN_PID=$!
          echo "Waiting for backend server to start (PID $UVICORN_PID)..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "status"; then
              echo "✅ Health check successful!"
              kill $UVICORN_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "❌ Health check failed!"
          kill $UVICORN_PID 2>/dev/null || true
          exit 1
        env:
          SKIP_STARTUP_CHECK:    "true"
          ENVIRONMENT:           testing
          LOG_LEVEL:             DEBUG
          AWS_ACCESS_KEY_ID:     "testing"
          AWS_SECRET_ACCESS_KEY: "testing"
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION || 'ap-south-1' }}
          DYNAMODB_REVIEWS_TABLE:    ${{ secrets.DYNAMODB_REVIEWS_TABLE || 'Reviews' }}
          DYNAMODB_BATCHES_TABLE:    ${{ secrets.DYNAMODB_BATCHES_TABLE || 'Batches' }}
          DYNAMODB_AGGREGATES_TABLE: ${{ secrets.DYNAMODB_AGGREGATES_TABLE || 'Aggregates' }}
          DYNAMODB_CORRECTIONS_TABLE: ${{ secrets.DYNAMODB_CORRECTIONS_TABLE || 'Corrections' }}
          S3_BUCKET_NAME:        ${{ secrets.S3_BUCKET_NAME || 'sentimetric-prod-storage' }}

      - name: Run pytest suite
        run: uv run pytest tests/ -v
        env:
          SKIP_STARTUP_CHECK:    "true"
          ENVIRONMENT:           testing
          AWS_ACCESS_KEY_ID:     "testing"
          AWS_SECRET_ACCESS_KEY: "testing"
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION || 'ap-south-1' }}
          DYNAMODB_REVIEWS_TABLE:    ${{ secrets.DYNAMODB_REVIEWS_TABLE || 'Reviews' }}
          DYNAMODB_BATCHES_TABLE:    ${{ secrets.DYNAMODB_BATCHES_TABLE || 'Batches' }}
          DYNAMODB_AGGREGATES_TABLE: ${{ secrets.DYNAMODB_AGGREGATES_TABLE || 'Aggregates' }}
          DYNAMODB_CORRECTIONS_TABLE: ${{ secrets.DYNAMODB_CORRECTIONS_TABLE || 'Corrections' }}

  # ──────────────────────────────────────────────────────────────
  # JOB 3 — Frontend Tests
  # ──────────────────────────────────────────────────────────────
  test-frontend:
    name: "🧪 Test Frontend"
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://placeholder.execute-api.ap-south-1.amazonaws.com' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_URL || 'https://placeholder.execute-api.ap-south-1.amazonaws.com' }}

  # ──────────────────────────────────────────────────────────────
  # JOB 4 — Auto Deploy Backend API → AWS (SAM)
  # ──────────────────────────────────────────────────────────────
  deploy-backend:
    name: "🚀 Deploy Backend API → AWS"
    needs: [detect-changes, test-backend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.deploy_infra == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Pull lightweight ML weights from S3
        run: |
          echo "📥 Updating backend/src/artifacts/..."
          mkdir -p src/artifacts
          aws s3 cp "s3://${{ secrets.S3_BUCKET_NAME }}/ml-artifacts/lambda_deploy_artifacts/mlp_weights.npz" src/artifacts/ || true
          aws s3 cp "s3://${{ secrets.S3_BUCKET_NAME }}/ml-artifacts/lambda_deploy_artifacts/issue_centroids.npy" src/artifacts/ || true
          aws s3 cp "s3://${{ secrets.S3_BUCKET_NAME }}/ml-artifacts/lambda_deploy_artifacts/config.json" src/artifacts/ || true
          echo "✅ Backend artifacts status:"
          find src/artifacts -type f -exec du -h {} + 2>/dev/null || echo "No artifacts found"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare backend deployment source folder
        run: |
          rm -rf deploy/src
          cp -r src deploy/src

      - name: Generate requirements.txt from uv.lock
        run: |
          uv export --no-dev --format requirements-txt --no-hashes -o requirements.txt
          cp requirements.txt deploy/requirements.txt

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Backup current Lambda deployment package (for rollback)
        id: backup
        run: |
          REGION="${{ secrets.AWS_REGION || 'ap-south-1' }}"
          FN_NAME="sentimetric-backend-api"
          CODE_URL=$(aws lambda get-function --function-name "$FN_NAME" --region "$REGION" --query "Code.Location" --output text 2>/dev/null || echo "")
          if [ -n "$CODE_URL" ] && [ "$CODE_URL" != "None" ]; then
            echo "📦 Downloading active Lambda package for instant rollback..."
            curl -s -o /tmp/sentimetric_backup.zip "$CODE_URL"
            if [ -s /tmp/sentimetric_backup.zip ]; then
              echo "has_backup=true" >> "$GITHUB_OUTPUT"
              echo "✅ Previous working Lambda code package backed up ($(du -h /tmp/sentimetric_backup.zip | cut -f1))."
            else
              echo "has_backup=false" >> "$GITHUB_OUTPUT"
              echo "⚠️ Could not save backup zip."
            fi
          else
            echo "has_backup=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Function does not exist yet or no code location returned."
          fi

      - name: SAM Build (Backend API)
        working-directory: backend/deploy
        run: |
          sam build --use-container --template-file template.yaml

      - name: SAM Deploy (Backend API)
        working-directory: backend/deploy
        run: |
          STACK_NAME="${{ secrets.CLOUDFORMATION_STACK_NAME || 'sentrix' }}"
          sam deploy \
            --config-env default \
            --stack-name "$STACK_NAME" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              FrontendOrigin="${{ secrets.FRONTEND_URL || 'https://sentiment-analysis-peach-eta.vercel.app' }}" \
              S3BucketName="${{ secrets.S3_BUCKET_NAME || 'sentimetric-prod-storage' }}" \
              DynamoDBReviewsTable="${{ secrets.DYNAMODB_REVIEWS_TABLE || 'Reviews' }}" \
              DynamoDBBatchesTable="${{ secrets.DYNAMODB_BATCHES_TABLE || 'Batches' }}" \
              DynamoDBAggregatesTable="${{ secrets.DYNAMODB_AGGREGATES_TABLE || 'Aggregates' }}" \
              DynamoDBCorrectionsTable="${{ secrets.DYNAMODB_CORRECTIONS_TABLE || 'Corrections' }}" \
              BgeTextEmbedderFunctionName="${{ secrets.BGE_TEXT_EMBEDDER_FUNCTION_NAME || 'bge-text-embeder' }}"

      - name: Output API Gateway URL
        id: api-info
        run: |
          STACK_NAME="${{ secrets.CLOUDFORMATION_STACK_NAME || 'sentrix' }}"
          REGION="${{ secrets.AWS_REGION || 'ap-south-1' }}"

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")

          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅  Backend API deployed successfully!"
          echo "  🌐  API Gateway URL : $API_URL"
          echo "  📋  Health check    : $API_URL/health"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Post-Deployment Smoke Test & Automated Rollback
        run: |
          API_URL="${{ steps.api-info.outputs.api_url }}"
          REGION="${{ secrets.AWS_REGION || 'ap-south-1' }}"
          FN_NAME="sentimetric-backend-api"
          HAS_BACKUP="${{ steps.backup.outputs.has_backup }}"

          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "❌ No API Gateway URL found from CloudFormation stack."
            exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Post-Deployment Smoke Test Initiated"
          echo "   Target URL: $API_URL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          SMOKE_PASSED=false

          # Test 1: Health check (/health) with retry loop for cold starts
          echo "👉 Checking /health endpoint..."
          for i in {1..8}; do
            HTTP_STATUS=$(curl -s -o /tmp/health_response.json -w "%{http_code}" "$API_URL/health" || echo "000")
            echo "   Attempt $i: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ] && grep -q "healthy" /tmp/health_response.json 2>/dev/null; then
              echo "   ✅ /health responded 200 OK: $(cat /tmp/health_response.json)"
              SMOKE_PASSED=true
              break
            fi
            echo "   ⏳ Health check attempt $i failed (Status: $HTTP_STATUS, Body: $(cat /tmp/health_response.json 2>/dev/null)). Waiting 3s..."
            sleep 3
          done

          if [ "$SMOKE_PASSED" != "true" ]; then
            echo "❌ SMOKE TEST FAILED: /health did not return 200 Healthy."
          else
            # Test 2: Database / router check (/api/admin/corrections)
            echo "👉 Checking /api/admin/corrections endpoint..."
            CORR_STATUS=$(curl -s -o /tmp/corr_response.json -w "%{http_code}" "$API_URL/api/admin/corrections" || echo "000")
            if [ "$CORR_STATUS" = "200" ]; then
              echo "   ✅ /api/admin/corrections responded 200 OK."
            else
              echo "   ❌ /api/admin/corrections returned HTTP $CORR_STATUS: $(cat /tmp/corr_response.json 2>/dev/null)"
              SMOKE_PASSED=false
            fi
          fi

          # If smoke test failed, trigger automated rollback
          if [ "$SMOKE_PASSED" != "true" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚨 POST-DEPLOYMENT SMOKE TEST FAILED! ROLLING BACK..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if [ "$HAS_BACKUP" = "true" ] && [ -s /tmp/sentimetric_backup.zip ]; then
              echo "🔄 Reverting Lambda '$FN_NAME' to previous working code package..."
              aws lambda update-function-code \
                --function-name "$FN_NAME" \
                --region "$REGION" \
                --zip-file fileb:///tmp/sentimetric_backup.zip > /dev/null
              
              aws lambda wait function-updated --function-name "$FN_NAME" --region "$REGION"
              echo "✅ Rollback complete. Lambda restored to previous working version."

              ROLLBACK_STATUS=$(curl -s -o /tmp/rb_check.json -w "%{http_code}" "$API_URL/health" || echo "000")
              echo "   Post-rollback /health check status: $ROLLBACK_STATUS"
            else
              echo "⚠️ No previous backup package available to roll back to."
            fi

            echo "❌ Deployment rejected due to smoke test failure. Halting pipeline to protect production."
            exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 ALL POST-DEPLOY SMOKE TESTS PASSED (ALL GREEN)!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ──────────────────────────────────────────────────────────────
  # JOB 5 — Auto Deploy Frontend → Vercel
  # ──────────────────────────────────────────────────────────────
  deploy-frontend:
    name: "🚀 Deploy Frontend → Vercel"
    needs: [detect-changes, test-frontend, deploy-backend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.test-frontend.result == 'success') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve backend API URL
        id: resolve-url
        run: |
          STACK_NAME="${{ secrets.CLOUDFORMATION_STACK_NAME || 'sentrix' }}"
          REGION="${{ secrets.AWS_REGION || 'ap-south-1' }}"

          LIVE_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")

          SECRET_URL="${{ secrets.VITE_API_URL || secrets.VITE_API_BASE_URL }}"

          if [ -n "$LIVE_URL" ] && [ "$LIVE_URL" != "None" ]; then
            echo "✅ Injected live CloudFormation URL: $LIVE_URL"
            echo "api_url=$LIVE_URL" >> "$GITHUB_OUTPUT"
          elif [ -n "$SECRET_URL" ]; then
            echo "⚠️ Injected URL from GitHub Secret: $SECRET_URL"
            echo "api_url=$SECRET_URL" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No backend URL found, using fallback placeholder."
            echo "api_url=https://placeholder.execute-api.ap-south-1.amazonaws.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel (production)
        id: vercel-deploy
        run: |
          npx vercel \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            --prod \
            --yes \
            --build-env VITE_API_URL="${{ steps.resolve-url.outputs.api_url }}" \
            --build-env VITE_API_BASE_URL="${{ steps.resolve-url.outputs.api_url }}" | tee deploy.log

          VERCEL_URL=$(grep -Eo "https://[a-zA-Z0-9._-]+\.vercel\.app" deploy.log | tail -1)
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅  Frontend deployed successfully to Vercel!"
          echo "  🌐  Vercel URL: $VERCEL_URL"
          echo "  🔗  Injected API URL: ${{ steps.resolve-url.outputs.api_url }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
